name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Greyscale palettes on purpose: the rest of the profile is monochrome,
      # so the generator's default green grid and purple snake would be the
      # only colour on the page.
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DahanItamar
          outputs: |
            dist/github-snake.svg?color_snake=#24292f&color_dots=#ebedf0,#d8dee4,#afb8c1,#8c959f,#57606a
            dist/github-snake-dark.svg?color_snake=#e6edf3&color_dots=#161b22,#2d333b,#4a525c,#768390,#adbac7

      # The generator frames the SVG tight around the grid, so the snake is
      # visibly clipped while it enters and leaves at the top-left corner.
      # Widen the viewBox (and the intrinsic size to match) to give it room.
      - name: Pad the frame so the snake never clips
        run: |
          cat > pad-frame.cjs <<'EOF'
          const fs = require("fs");

          const PAD_X = 20;
          const PAD_Y = 24;
          const HEADER = /viewBox="(-?\d+) (-?\d+) (\d+) (\d+)" width="(\d+)" height="(\d+)"/;

          for (const name of fs.readdirSync("dist").filter((n) => n.endsWith(".svg"))) {
            const file = `dist/${name}`;
            const svg = fs.readFileSync(file, "utf8");
            const match = svg.match(HEADER);
            if (!match) {
              console.log(`skipped ${name} — unexpected header`);
              continue;
            }
            const [x, y, w, h, width, height] = match.slice(1).map(Number);
            const padded =
              `viewBox="${x - PAD_X} ${y - PAD_Y} ${w + PAD_X * 2} ${h + PAD_Y * 2}"` +
              ` width="${width + PAD_X * 2}" height="${height + PAD_Y * 2}"`;
            fs.writeFileSync(file, svg.replace(HEADER, padded));
            console.log(`padded ${name}`);
          }
          EOF
          node pad-frame.cjs
          rm pad-frame.cjs

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
