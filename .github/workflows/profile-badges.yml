name: Update profile badges

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/profile_badges.py", ".github/workflows/profile-badges.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Merged-PR counts and cards come from public data; the token only raises the rate limit.
      - name: Render badges and open-source PR cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/profile_badges.py

      - name: Commit changes
        run: |
          git add .github/assets README.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(profile): update badges and open-source PR cards"
          git push
