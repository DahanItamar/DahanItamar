<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 900 95'
    style='background-color: #101419;'
    width='900px' height='95px'>

    <style>
@font-face {
  font-family: 'Geist';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='2200ms' fill="freeze"
                    values='m0,35 h0 ; m0,35 h0 ; m0,35 h900 ; m0,35 h900' keyTimes='0;0;0.81818181818182;1' />
                    </path>
    <text font-family='"Geist", monospace' fill='#C6F27F' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            I build useful systems.
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s'
                    dur='4400ms' fill="freeze"
                    values='m0,70 h0 ; m0,70 h0 ; m0,70 h900 ; m0,70 h900' keyTimes='0;0.5;0.90909090909091;1' />
                    </path>
    <text font-family='"Geist", monospace' fill='#C6F27F' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Then make them dependable.
        </textPath>
    </text>
</svg>
